.package:framework-bundle:
    variables:
        PACKAGE: framework-bundle
        PHP_LOWEST_VERSION: '8.2'
        REPOSITORY: git@github.com:fusonic/php-framework-bundle.git

test:framework-bundle:phpcs:
    extends: [ .test:phpcs, .package:framework-bundle ]

test:framework-bundle:phpstan:
    extends: [ .test:phpstan, .package:framework-bundle ]

test:framework-bundle:rector:
    extends: [ .test:rector, .package:framework-bundle ]

test:framework-bundle:phpunit:
    extends: [ .test:phpunit, .package:framework-bundle ]

test:framework-bundle:phpunit-lowest-deps:
    extends: [ .test:phpunit-lowest-deps, .package:framework-bundle ]

test:framework-bundle:phpunit-latest:
    extends: [ .test:phpunit-latest, .package:framework-bundle ]

test:framework-bundle:infection:
    extends: [ .test:infection, .package:framework-bundle ]

publish:framework-bundle:branch:
    extends: [ .publish:branch, .package:framework-bundle ]
    environment:
        on_stop: publish:framework-bundle:delete-branch

publish:framework-bundle:tag:
    extends: [ .publish:tag, .package:framework-bundle ]

publish:framework-bundle:delete-branch:
    extends: [ .publish:delete-branch, .package:framework-bundle ]

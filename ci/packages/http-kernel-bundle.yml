.package:http-kernel-bundle:
    variables:
        PACKAGE: http-kernel-bundle
        PHP_LOWEST_VERSION: '8.2'
        REPOSITORY: git@github.com:fusonic/php-http-kernel-bundle.git

test:http-kernel-bundle:phpcs:
    extends: [ .test:phpcs, .package:http-kernel-bundle ]

test:http-kernel-bundle:phpstan:
    extends: [ .test:phpstan, .package:http-kernel-bundle ]

test:http-kernel-bundle:rector:
    extends: [ .test:rector, .package:http-kernel-bundle ]

test:http-kernel-bundle:phpunit:
    extends: [ .test:phpunit, .package:http-kernel-bundle ]

test:http-kernel-bundle:phpunit-matrix:
    extends: [ .test:phpunit-matrix, .package:http-kernel-bundle ]

test:http-kernel-bundle:infection:
    extends: [ .test:infection, .package:http-kernel-bundle ]

publish:http-kernel-bundle:branch:
    extends: [ .publish:branch, .package:http-kernel-bundle ]
    environment:
        on_stop: publish:http-kernel-bundle:delete-branch

publish:http-kernel-bundle:tag:
    extends: [ .publish:tag, .package:http-kernel-bundle ]

publish:http-kernel-bundle:delete-branch:
    extends: [ .publish:delete-branch, .package:http-kernel-bundle ]

.package:csv-reader:
    variables:
        PACKAGE: csv-reader
        PHP_LOWEST_VERSION: '8.2'
        REPOSITORY: git@github.com:fusonic/php-csv-reader.git

test:csv-reader:phpcs:
    extends: [ .test:phpcs, .package:csv-reader ]

test:csv-reader:phpstan:
    extends: [ .test:phpstan, .package:csv-reader ]

test:csv-reader:rector:
    extends: [ .test:rector, .package:csv-reader ]

test:csv-reader:phpunit:
    extends: [ .test:phpunit, .package:csv-reader ]

test:csv-reader:phpunit-lowest-deps:
    extends: [ .test:phpunit-lowest-deps, .package:csv-reader ]

test:csv-reader:phpunit-latest:
    extends: [ .test:phpunit-latest, .package:csv-reader ]

test:csv-reader:infection:
    extends: [ .test:infection, .package:csv-reader ]

publish:csv-reader:branch:
    extends: [ .publish:branch, .package:csv-reader ]
    environment:
        on_stop: publish:csv-reader:delete-branch

publish:csv-reader:tag:
    extends: [ .publish:tag, .package:csv-reader ]

publish:csv-reader:delete-branch:
    extends: [ .publish:delete-branch, .package:csv-reader ]

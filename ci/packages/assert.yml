.package:assert:
    variables:
        PACKAGE: assert
        PHP_LOWEST_VERSION: '8.2'
        REPOSITORY: git@github.com:fusonic/php-assert.git

test:assert:phpcs:
    extends: [ .test:phpcs, .package:assert ]

test:assert:phpstan:
    extends: [ .test:phpstan, .package:assert ]

test:assert:rector:
    extends: [ .test:rector, .package:assert ]

test:assert:phpunit:
    extends: [ .test:phpunit, .package:assert ]

test:assert:phpunit-matrix:
    extends: [ .test:phpunit-matrix, .package:assert ]

test:assert:infection:
    extends: [ .test:infection, .package:assert ]

publish:assert:branch:
    extends: [ .publish:branch, .package:assert ]
    environment:
        on_stop: publish:assert:delete-branch

publish:assert:tag:
    extends: [ .publish:tag, .package:assert ]

publish:assert:delete-branch:
    extends: [ .publish:delete-branch, .package:assert ]

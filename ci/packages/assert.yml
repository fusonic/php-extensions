.package:assert:
    variables:
        PACKAGE: assert
        PHP_LOWEST_VERSION: '8.4'
        REPOSITORY: git@github.com:fusonic/php-assert.git

assert:test:phpcs:
    extends: [ .test:phpcs, .package:assert ]

assert:test:phpstan:
    extends: [ .test:phpstan, .package:assert ]

assert:test:rector:
    extends: [ .test:rector, .package:assert ]

assert:test:phpunit:
    extends: [ .test:phpunit, .package:assert ]

assert:test:phpunit-lowest-deps:
    extends: [ .test:phpunit-lowest-deps, .package:assert ]

assert:test:phpunit-latest:
    extends: [ .test:phpunit-latest, .package:assert ]

assert:test:infection:
    extends: [ .test:infection, .package:assert ]

assert:publish:branch:
    extends: [ .publish:branch, .package:assert ]
    environment:
        on_stop: assert:publish:delete-branch

assert:publish:tag:
    extends: [ .publish:tag, .package:assert ]

assert:publish:delete-branch:
    extends: [ .publish:delete-branch, .package:assert ]

.package:ddd-extensions:
    variables:
        PACKAGE: ddd-extensions
        PHP_LOWEST_VERSION: '8.4'
        REPOSITORY: git@github.com:fusonic/php-ddd-extensions.git

ddd-extensions:test:phpcs:
    extends: [ .test:phpcs, .package:ddd-extensions ]

ddd-extensions:test:phpstan:
    extends: [ .test:phpstan, .package:ddd-extensions ]

ddd-extensions:test:rector:
    extends: [ .test:rector, .package:ddd-extensions ]

ddd-extensions:test:phpunit:
    extends: [ .test:phpunit, .package:ddd-extensions ]

ddd-extensions:test:phpunit-lowest-deps:
    extends: [ .test:phpunit-lowest-deps, .package:ddd-extensions ]

ddd-extensions:test:phpunit-latest:
    extends: [ .test:phpunit-latest, .package:ddd-extensions ]

ddd-extensions:test:infection:
    extends: [ .test:infection, .package:ddd-extensions ]

ddd-extensions:publish:branch:
    extends: [ .publish:branch, .package:ddd-extensions ]
    environment:
        on_stop: ddd-extensions:publish:delete-branch

ddd-extensions:publish:tag:
    extends: [ .publish:tag, .package:ddd-extensions ]

ddd-extensions:publish:delete-branch:
    extends: [ .publish:delete-branch, .package:ddd-extensions ]

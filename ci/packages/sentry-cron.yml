.package:sentry-cron:
    variables:
        PACKAGE: sentry-cron
        PHP_LOWEST_VERSION: '8.4'
        REPOSITORY: git@github.com:fusonic/php-sentry-cron.git

test:sentry-cron:phpcs:
    extends: [ .test:phpcs, .package:sentry-cron ]

test:sentry-cron:phpstan:
    extends: [ .test:phpstan, .package:sentry-cron ]

test:sentry-cron:rector:
    extends: [ .test:rector, .package:sentry-cron ]

test:sentry-cron:phpunit:
    extends: [ .test:phpunit, .package:sentry-cron ]

test:sentry-cron:phpunit-lowest-deps:
    extends: [ .test:phpunit-lowest-deps, .package:sentry-cron ]

test:sentry-cron:phpunit-latest:
    extends: [ .test:phpunit-latest, .package:sentry-cron ]

test:sentry-cron:infection:
    extends: [ .test:infection, .package:sentry-cron ]

publish:sentry-cron:branch:
    extends: [ .publish:branch, .package:sentry-cron ]
    environment:
        on_stop: publish:sentry-cron:delete-branch

publish:sentry-cron:tag:
    extends: [ .publish:tag, .package:sentry-cron ]

publish:sentry-cron:delete-branch:
    extends: [ .publish:delete-branch, .package:sentry-cron ]

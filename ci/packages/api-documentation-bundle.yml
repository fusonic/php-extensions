.package:api-documentation-bundle:
    variables:
        PACKAGE: api-documentation-bundle
        PHP_LOWEST_VERSION: '8.4'
        REPOSITORY: git@github.com:fusonic/php-api-documentation-bundle.git

api-documentation-bundle:test:phpcs:
    extends: [ .test:phpcs, .package:api-documentation-bundle ]

api-documentation-bundle:test:phpstan:
    extends: [ .test:phpstan, .package:api-documentation-bundle ]

api-documentation-bundle:test:rector:
    extends: [ .test:rector, .package:api-documentation-bundle ]

api-documentation-bundle:test:phpunit:
    extends: [ .test:phpunit, .package:api-documentation-bundle ]

api-documentation-bundle:test:phpunit-lowest-deps:
    extends: [ .test:phpunit-lowest-deps, .package:api-documentation-bundle ]

api-documentation-bundle:test:phpunit-latest:
    extends: [ .test:phpunit-latest, .package:api-documentation-bundle ]

api-documentation-bundle:test:infection:
    extends: [ .test:infection, .package:api-documentation-bundle ]

api-documentation-bundle:publish:branch:
    extends: [ .publish:branch, .package:api-documentation-bundle ]
    environment:
        on_stop: api-documentation-bundle:publish:delete-branch

api-documentation-bundle:publish:tag:
    extends: [ .publish:tag, .package:api-documentation-bundle ]

api-documentation-bundle:publish:delete-branch:
    extends: [ .publish:delete-branch, .package:api-documentation-bundle ]

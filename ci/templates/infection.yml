.test:infection:
    extends: .php:base
    variables:
        XDEBUG_MODE: coverage
    script:
        - composer infection
    environment:
        name: coverage/${PACKAGE}/${CI_COMMIT_REF_NAME}/infection
        url: https://gitlab.com/${CI_PROJECT_PATH}/-/jobs/${CI_JOB_ID}/artifacts/file/packages/${PACKAGE}/coverage/infection/infection.html
        auto_stop_in: 1 week
    artifacts:
        paths:
            - packages/${PACKAGE}/coverage/infection
        expire_in: 1 week
    allow_failure: true
    rules:
        - changes:
              - packages/${PACKAGE}/src/**/*
              - packages/${PACKAGE}/tests/**/*
              - ci/templates/*.yml
              - ci/build.yml
              - ci/packages/${PACKAGE}.yml
              - .gitlab-ci.yml
          when: manual

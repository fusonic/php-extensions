include:
    - local: 'ci/packages/*.yml'
    - local: 'ci/templates/*.yml'
    - local: 'ci/build.yml'

stages:
    - build
    - test
    - publish

variables:
    DOCKER_IMAGE: docker:29.8
    DOCKER_DIND_IMAGE: docker:29.8-dind-rootless
    PHP_LATEST_VERSION: '8.5'
    PHP_DOCKER_RELEASE: 'trixie'

default:
    interruptible: true

workflow:
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
        - if: $CI_MERGE_REQUEST_IID
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - if: $CI_PIPELINE_SOURCE == "web"
